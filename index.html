<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WeekendBio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Background Candles -->
<div class="candles-bg">
  <canvas id="candlesCanvas"></canvas>
</div>

<!-- Newsletter Popup -->
<div class="popup" id="popup">
  <h2>Join the WeekendBio Newsletter</h2>
  <p>Weekly stock insights, trends, and plays.</p>

  <form id="popup-form">
    <input type="email" name="email" placeholder="you@email.com" required />
    <button type="submit">Join Free</button>
  </form>

  <span class="popup-close" onclick="closePopup()">×</span>
</div>

<!-- Main Content -->
<main>
  <section class="hero">
    <h1>WeekendBio</h1>
    <p>Stocks. Trends. Market Psychology.</p>
  </section>

  <section class="newsletter">
    <h2>Get Market Moves First</h2>
    <p>No spam. No fluff. Just signal.</p>

    <form id="newsletter-form">
      <input type="email" name="email" placeholder="you@email.com" required />
      <button type="submit">Join Newsletter</button>
    </form>

    <p class="success" id="success-msg">You're in. Check your inbox.</p>
  </section>

  <section class="discord">
    <a href="https://discord.gg/8EhbrVfJpv" target="_blank" class="discord-btn">
      Join the Discord
    </a>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
