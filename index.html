<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WeekendBio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Background Chart -->
<canvas id="chartCanvas"></canvas>

<!-- Newsletter Popup -->
<div class="popup" id="popup">
  <h2>WeekendBio</h2>
  <p>Weekly market insights & trend breakdowns.</p>

  <form id="popup-form">
    <input type="email" name="email" placeholder="you@email.com" required />
    <button type="submit">Join Free</button>
  </form>

  <span class="popup-close" onclick="closePopup()">×</span>
</div>

<main>
  <section class="hero">
    <h1>WeekendBio</h1>
    <p>Market intelligence for the weekend trader.</p>
  </section>

  <section class="newsletter">
    <h2>Get the Edge</h2>
    <p>No spam. Just signal.</p>

    <form id="newsletter-form">
      <input type="email" name="email" placeholder="you@email.com" required />
      <button type="submit">Subscribe</button>
    </form>

    <span id="success-msg">You're in. Welcome.</span>
  </section>

  <section class="discord">
    <a href="https://discord.gg/8EhbrVfJpv" target="_blank">
      Join the Discord
    </a>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
